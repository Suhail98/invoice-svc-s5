name: security
on: [push, pull_request]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required to scan pull requests

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error src/

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (CycloneDX) with pinned Trivy
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.0
          fs --format cyclonedx --scanners vuln --output /src/sbom.cdx.json /src
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
